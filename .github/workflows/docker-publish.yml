name: Docker Image CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  # No path filter on the triggers above -- doc-only PRs still deserve a build+test check. Instead,
  # only the image build/push job (the expensive, src-only-relevant part) is gated on whether
  # src/** actually changed, via this job's output.
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for src/** changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'

  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

  build-and-push-image:
    needs: [changes, test, version]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The MCP server image (Dockerfile's default target -- built with no --target so a
          # bare `docker build -f src/Dockerfile .` keeps working exactly as documented).
          - target: server
            image_name: ${{ github.repository }}
          # dndump only, no MCP server bits -- much smaller pull for shell-driven/agent workflows
          # that never talk MCP at all. Published as its own package (distinct name, not just a
          # tag) so it's discoverable and versioned independently in the registry UI.
          - target: cli
            image_name: ${{ github.repository }}-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 // v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 // v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c // v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c // v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 // v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=${{ needs.version.outputs.semVer }}

      - name: Build and push Docker image (${{ matrix.target }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a // v7.3.0
        with:
          context: .
          file: src/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.version.outputs.semVer }}
            ASSEMBLY_VERSION=${{ needs.version.outputs.assemblySemVer }}
